# ========================================================
# AMail — Nginx HTTP Bootstrap Configuration
# Used during first installation before SSL certificates exist
# ========================================================

limit_req_zone $binary_remote_addr zone=amail_limit:10m rate=15r/s;

upstream amail_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name amail.viomet.online mail.viomet.online;

    # Let's Encrypt ACME Challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Block access to hidden files and sensitive extensions
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sqlite3|env|py|sh|log|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Files
    location /static/ {
        alias /var/www/amail/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Reverse Proxy to Gunicorn
    location / {
        limit_req zone=amail_limit burst=20 nodelay;

        proxy_pass http://amail_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}
