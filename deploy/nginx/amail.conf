# ========================================================
# AMail — Nginx Production HTTPS Reverse Proxy Configuration
# Domain: amail.viomet.online & mail.viomet.online
# ========================================================

# Rate limiting zone (10MB memory stores ~160,000 IP states)
limit_req_zone $binary_remote_addr zone=amail_limit:10m rate=15r/s;

upstream amail_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# --------------------------------------------------------
# HTTP Server (Port 80) -> Redirect to HTTPS
# --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name amail.viomet.online mail.viomet.online;

    # Let's Encrypt ACME Challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://amail.viomet.online$request_uri;
    }
}

# --------------------------------------------------------
# HTTPS Server (Port 443)
# --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amail.viomet.online;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/amail.viomet.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amail.viomet.online/privkey.pem;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/amail.viomet.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amail.viomet.online/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AMailSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request Size Limits
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Block access to hidden files and sensitive extensions
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sqlite3|env|py|sh|log|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Files (Direct file serving with caching)
    location /static/ {
        alias /var/www/amail/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Reverse Proxy to Gunicorn
    location / {
        limit_req zone=amail_limit burst=20 nodelay;

        proxy_pass http://amail_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}
